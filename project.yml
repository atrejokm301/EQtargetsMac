name: EQtargets
options:
  bundleIdPrefix: com.eqtargets
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Local, unsigned-for-distribution builds. Ad-hoc signing is enough for the
    # app and for the HAL driver on this Mac (verified: ad-hoc HAL plug-ins load).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s

targets:

  # ---------------------------------------------------------------- app
  EQtargets:
    type: application
    platform: macOS
    sources:
      - path: Sources/EQTCore
      - path: Sources/EQTAudio
      - path: Sources/App
      - path: Shared
        buildPhase: none
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: EQtargets
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: EQtargets
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eqtargets.app
        PRODUCT_NAME: EQtargets
        SWIFT_OBJC_BRIDGING_HEADER: Shared/EQtargets-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      # Ship the driver inside the app so the in-app installer can copy it to
      # /Library/Audio/Plug-Ins/HAL with one admin prompt.
      - target: EQtargetsAudioDriver
        embed: true
        codeSign: false
        copy:
          destination: resources

  # ---------------------------------------------------------------- HAL driver
  EQtargetsAudioDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Driver
      - path: Shared/EQTRingProtocol.h
        buildPhase: headers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eqtargets.app.driver
        PRODUCT_NAME: EQtargetsAudio
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: Driver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        OTHER_LDFLAGS: -framework CoreAudio -framework CoreFoundation
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: YES

  # ---------------------------------------------------------------- unit tests
  # Logic tests with NO host app: they compile the EQTCore sources directly, so
  # DSP/model tests never depend on the UI or the audio-device layer building.
  EQTCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/EQTCore
      - path: Tests/EQTCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eqtargets.app.coretests
        SWIFT_OBJC_BRIDGING_HEADER: Shared/EQtargets-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # ---------------------------------------------------------------- tools
  # Device / ring inspector: --devices, --ring, --selftest (tone into the device).
  eqt-probe:
    type: tool
    platform: macOS
    sources:
      - path: Tools/probe
    settings:
      base:
        PRODUCT_NAME: eqt-probe
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        OTHER_LDFLAGS: -framework CoreAudio -framework CoreFoundation -framework AudioToolbox

  # Loads the BUILT driver bundle in-process with a fake host and drives its
  # IO path, so the driver is tested without installing it into coreaudiod.
  eqt-driver-harness:
    type: tool
    platform: macOS
    sources:
      - path: Tools/driver-harness
    settings:
      base:
        PRODUCT_NAME: eqt-driver-harness
        HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
        OTHER_LDFLAGS: -framework CoreAudio -framework CoreFoundation

  # Headless engine: runs the real routing + DSP without UI (logs stats), and
  # an --offline selftest that fakes the driver writer in-process.
  eqt-engine:
    type: tool
    platform: macOS
    sources:
      - path: Sources/EQTCore
      - path: Sources/EQTAudio
      - path: Tools/engine-cli
    settings:
      base:
        PRODUCT_NAME: eqt-engine
        SWIFT_OBJC_BRIDGING_HEADER: Shared/EQtargets-Bridging-Header.h

schemes:
  EQtargets:
    build:
      targets:
        EQtargets: all
        EQtargetsAudioDriver: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EQTCoreTests
    profile:
      config: Release
    archive:
      config: Release
  EQTCoreTests:
    build:
      targets:
        EQTCoreTests: [test]
    test:
      config: Debug
      targets:
        - EQTCoreTests
  EQtargetsAudioDriver:
    build:
      targets:
        EQtargetsAudioDriver: all
  eqt-probe:
    build:
      targets:
        eqt-probe: all
  eqt-driver-harness:
    build:
      targets:
        eqt-driver-harness: all
        EQtargetsAudioDriver: all
  eqt-engine:
    build:
      targets:
        eqt-engine: all
